name: Test, build and publish

# The game is not in the image (SteamCMD installs it on the first start), so there is no upstream
# release to follow: a push to main publishes, and the weekly run rebuilds on a patched
# steamcmd/steamcmd base. Publishing :latest does not touch running servers: a Flux app only
# takes a new image when its spec is updated or it is redeployed.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays: the base image's security updates and a current SteamCMD, same scripts.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/7dtd-server-flux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py

      # Pinned, so "shellcheck is clean on my machine" means the same thing here.
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x scripts/*.sh tests/*.sh

      - name: Unit tests
        run: ./tests/test-flux.sh

  build:
    needs: test
    # A pull request gets the tests and nothing else: it must not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUX_IMAGE_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          docker run --rm --entrypoint bash "${IMAGE_NAME}:${{ github.sha }}" -c '
            set -e
            command -v steamcmd python3 pgrep curl >/dev/null
            python3 /opt/flux/flux-telnet.py >/dev/null 2>&1 || [ $? = 64 ]
            python3 /opt/flux/flux-serverconfig.py >/dev/null 2>&1 || [ $? = 64 ]
            bash -n /opt/flux/flux-entrypoint.sh
          '
